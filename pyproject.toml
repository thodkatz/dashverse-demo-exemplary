[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cellcount"
version = "1.0.0"
description = "Count and measure cells in 2D microscopy images."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alice Demo"}]
requires-python = ">=3.9"
dependencies = ["numpy>=2.2.6", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cellcount = "cellcount.cli:main"

[project.urls]
Homepage = "https://github.com/thodkatz/dashverse-demo-exemplary"
Issues = "https://github.com/thodkatz/dashverse-demo-exemplary/issues"

[tool.setuptools.packages.find]
where = ["src"]
